<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>meeseeks</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: black;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    #video {
        max-width: 80vw;
        max-height: 80vh;
        border-radius: 20px;
        transition: transform 0.04s linear;
        will-change: transform, filter;
    }
</style>
</head>
<body>

<video id="video" autoplay loop controls playsinline>
    <source src="video.webm" type="video/webm">
    <source src="video.mp4" type="video/mp4">
    Your browser does not support video.
</video>

<script>
const video = document.getElementById("video");

let audioCtx;
let analyser;
let dataArray;
let source;
let initialized = false;
let running = false;

async function initAudio() {
    if (initialized) return;

    audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    try {
        source = audioCtx.createMediaElementSource(video);
    } catch (e) {
        // prevents "already connected" error if re-init happens
        return;
    }

    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;

    source.connect(analyser);
    analyser.connect(audioCtx.destination);

    dataArray = new Uint8Array(analyser.frequencyBinCount);

    initialized = true;
    running = true;

    animate();
}

function animate() {
    if (!running) return;

    requestAnimationFrame(animate);

    if (!analyser) return;

    analyser.getByteFrequencyData(dataArray);

    let bass = 0;
    for (let i = 0; i < 15; i++) {
        bass += dataArray[i];
    }
    bass /= 15;

    const scale = 1 + bass / 1800;
    const rotate = (bass - 60) / 50;
    const glow = bass / 10;

    video.style.transform = `scale(${scale}) rotate(${rotate}deg)`;
    video.style.filter = `drop-shadow(0 0 ${glow}px white)`;
}

async function unlock() {
    await initAudio();

    if (audioCtx.state === "suspended") {
        await audioCtx.resume();
    }

    if (video.paused) {
        await video.play();
    }
}

// REQUIRED: user gesture for audio
document.body.addEventListener("click", unlock, { once: true });
document.body.addEventListener("touchstart", unlock, { once: true });

video.addEventListener("play", unlock);
</script>

</body>
</html>
